name: Release on tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & upload (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Debug workspace
        shell: bash
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          ls -la
          echo "--- wails dir ---"
          ls -la ./wails || true
          echo "--- wails/frontend dir ---"
          ls -la ./wails/frontend || true

      - uses: actions/setup-go@v5
        with:
          # Go >= 1.24 emits the LC_UUID load command that macOS 15.4+/26
          # dyld requires; binaries built with older Go abort on launch
          # ("missing LC_UUID load command") on current macos-latest runners.
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: "wails/go.sum"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "wails/frontend/package-lock.json"

      - name: Install frontend deps
        working-directory: wails/frontend
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build app
        shell: bash
        run: |
          cd wails
          pwd
          ls -la
          # Universal binary so both Apple Silicon and Intel Macs can run it.
          if [ "$RUNNER_OS" = "macOS" ]; then
            wails build -platform darwin/universal
            # Ad-hoc signature sealing the whole bundle (Go already ad-hoc
            # signs the executable; without a Developer ID, Gatekeeper still
            # requires the xattr step documented in the release notes).
            codesign --force --deep --sign - "build/bin/P4RS3LT0NGV3.app"
          else
            wails build
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "wails/build/bin/*" -DestinationPath "P4RS3LT0NGV3-${{ github.ref_name }}-windows.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Write the archive at the workspace root (4 ups from wails/build/bin
        # lands OUTSIDE the repo, so the release step never found the file).
        run: |
          tar -czf "P4RS3LT0NGV3-${{ github.ref_name }}-macOS.tar.gz" -C wails/build/bin .

      - name: Create release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            P4RS3LT0NGV3-${{ github.ref_name }}-windows.zip
            P4RS3LT0NGV3-${{ github.ref_name }}-macOS.tar.gz
          fail_on_unmatched_files: false
          body: |
            ## 安装说明

            ### Windows
            解压 `P4RS3LT0NGV3-${{ github.ref_name }}-windows.zip` 后运行 `P4RS3LT0NGV3.exe`。若被 SmartScreen 拦截：更多信息 → 仍要运行。

            ### macOS（通用二进制，Apple Silicon / Intel）
            解压 `P4RS3LT0NGV3-${{ github.ref_name }}-macOS.tar.gz`，将 `P4RS3LT0NGV3.app` 拖入「应用程序」。

            应用未接入 Apple 开发者签名（无付费开发者账号），首次打开前需移除隔离属性：

            ```bash
            xattr -dr com.apple.quarantine /Applications/P4RS3LT0NGV3.app
            ```

            或右键 → 打开 绕过 Gatekeeper。
